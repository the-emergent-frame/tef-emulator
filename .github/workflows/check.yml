name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install reference Rust toolchain
        run: |
          rustup toolchain install 1.75.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.75.0
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --offline
      - run: cargo clippy --workspace --all-targets --offline -- -D warnings
      - run: PYTHONPATH=python python3 -m unittest discover -s python/tests -v
      - run: node --check viewer/public/app.js
      - run: node --test viewer/tests/*.test.mjs
